<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biwen IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* LOGIN SCREEN */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: var(--panel-bg); padding: 40px; border-radius: 16px; width: 100%; max-width: 480px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); border: 1px solid var(--border);
        }
        .login-card h2 { margin-bottom: 24px; font-size: 24px; color: var(--text-main); text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-main); font-size: 16px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--accent); }
        .btn {
            width: 100%; padding: 12px; background: var(--accent); color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .helper-text { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }

        /* MAIN APP LAYOUT */
        #app-screen { display: none; height: 100vh; grid-template-columns: 320px 1fr; grid-template-rows: 60px 1fr; }
        header {
            grid-column: 1 / -1; background: var(--panel-bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
        }
        header h1 { font-size: 18px; color: var(--text-main); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .logout-btn:hover { color: white; border-color: white; }

        /* SIDEBAR */
        sidebar { background: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .nav-tabs { display: flex; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
        .nav-tab { flex: 1; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-muted); background: none; border: none; cursor: pointer; }
        .nav-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: var(--panel-bg); }
        .search-box { padding: 12px; border-bottom: 1px solid var(--border); }
        .search-box input { width: 100%; padding: 8px 12px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: white; font-size: 14px; outline: none; }
        .list-container { overflow-y: auto; flex: 1; }
        .list-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: space-between; }
        .list-item:hover { background: rgba(255,255,255,0.03); }
        .list-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); border-left: 4px solid var(--accent); }

        /* CONTENT / PLAYER */
        main { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 60px); background: var(--bg-color); overflow: hidden; }
        .player-section { display: flex; flex-direction: column; justify-content: center; align-items: center; background: black; position: relative; }
        video { width: 100%; height: 100%; max-height: calc(100vh - 60px); outline: none; }
        
        .channels-pane { border-left: 1px solid var(--border); background: var(--panel-bg); display: flex; flex-direction: column; overflow: hidden; }
        .pane-header { padding: 16px; font-weight: 600; border-bottom: 1px solid var(--border); font-size: 15px; }

        /* LOADER */
        #loader { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); display: none; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; gap: 12px; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text" style="font-size: 14px; color: var(--text-muted);">Conectando con servidor...</div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Biwen IPTV</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>URL del Servidor IPTV</label>
                    <input type="text" id="server-url" value="http://line.tivi-ott.net" required placeholder="http://tuseridor.com:puerto">
                </div>
                <div class="form-group">
                    <label>URL de tu Cloudflare Proxy</label>
                    <input type="text" id="proxy-url" required placeholder="https://tu-worker.tu-usuario.workers.dev">
                    <div class="helper-text">Pega aquí el enlace de tu Worker para evitar bloqueos HTTP/HTTPS.</div>
                </div>
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="username" required placeholder="Tu usuario">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required placeholder="Tu contraseña">
                </div>
                <button type="submit" class="btn">Conectar</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen">
        <header>
            <h1 id="app-title">Biwen IPTV</h1>
            <button class="logout-btn" id="logout-btn">Cerrar Sesión</button>
        </header>

        <sidebar>
            <div class="nav-tabs">
                <button class="nav-tab active" data-type="live">En Vivo</button>
                <button class="nav-tab" data-type="vod">Películas</button>
                <button class="nav-tab" data-type="series">Series</button>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar...">
            </div>
            <div class="list-container" id="categories-list"></div>
        </sidebar>

        <main>
            <div class="player-section">
                <video id="video-player" controls playsinline></video>
            </div>
            <div class="channels-pane">
                <div class="pane-header" id="pane-title">Selecciona una categoría</div>
                <div class="list-container" id="items-list"></div>
            </div>
        </main>
    </div>

    <script>
        let authData = {};
        let currentType = 'live';
        let categoriesData = { live: [], vod: [], series: [] };
        let activeCategory = null;
        let hls = null;

        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('iptv_server')) document.getElementById('server-url').value = localStorage.getItem('iptv_server');
            if (localStorage.getItem('iptv_proxy')) document.getElementById('proxy-url').value = localStorage.getItem('iptv_proxy');
            if (localStorage.getItem('iptv_user')) document.getElementById('username').value = localStorage.getItem('iptv_user');
            if (localStorage.getItem('iptv_pass')) document.getElementById('password').value = localStorage.getItem('iptv_pass');
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            authData.server = document.getElementById('server-url').value.replace(/\/$/, '');
            authData.proxy = document.getElementById('proxy-url').value.replace(/\/$/, '');
            authData.user = document.getElementById('username').value;
            authData.pass = document.getElementById('password').value;

            localStorage.setItem('iptv_server', authData.server);
            localStorage.setItem('iptv_proxy', authData.proxy);
